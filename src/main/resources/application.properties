spring.application.name=demo

management.endpoints.web.exposure.include=*
management.info.env.enabled=true

info.app.full-name=Thomas Nguyen
info.app.version=1.0.0

spring.security.user.name=root
spring.security.user.password=alpine

logging.file.name=logs/app.log

# Sets the global default level for all loggers to WARN (hides INFO, DEBUG, TRACE)
logging.level.root=WARN

# Sets your specific application package level to WARN
logging.level.io.github.tthn0.demo=WARN

logging.logback.rollingpolicy.file-name-pattern=logs/app.%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

spring.datasource.url=jdbc:postgresql://localhost:5432/hibernate
spring.datasource.username=username
spring.datasource.password=password

# Makes Hibernate try to update teh DB schema to match our entities on the server side
spring.jpa.hibernate.ddl-auto=update

# Doesn't modify anything but makes sure Hibernate checks that the schema matches
# spring.jpa.hibernate.ddl-auto=validate

# Drop and recreate the schema every time the app starts
# spring.jpa.hibernate.ddl-auto=create

# Create the schema on startup and drops it when the app shuts down
# spring.jpa.hibernate.ddl-auto=create-drop


# http://localhost:8080/graphiql
spring.graphql.graphiql.enabled=true
spring.graphql.schema.file-extensions=.gql,.graphqls